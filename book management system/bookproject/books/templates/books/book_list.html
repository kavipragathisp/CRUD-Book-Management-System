
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Management System</title>
</head>
<body>
    <h1>Book Management System</h1>

    <a href="{% url 'add_book' %}">Add New Book</a>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>₹{{ book.price }}</td>
            <td>
                <a href="{% url 'update_book' book.pk %}">Update</a>

                <form method="post"
                      action="{% url 'delete_book' book.pk %}"
                      style="display:inline">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No books found. Add your first book!</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
